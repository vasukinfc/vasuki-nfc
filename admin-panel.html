<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VASUKI Admin Panel</title>
<style>
  body { font-family: Arial, sans-serif; background: #f5f5f5; display: flex; justify-content: center; padding: 40px; margin: 0; }
  .panel { background: white; padding: 30px; border-radius: 12px; width: 460px; max-width: 100%; box-shadow: 0 6px 20px rgba(0,0,0,0.15); }
  .panel h2 { text-align: center; margin-bottom: 25px; color: #ff416c; }
  input, select, textarea { width: 100%; padding: 12px; margin: 8px 0; border-radius: 6px; border: 1px solid #ccc; box-sizing: border-box; }
  textarea { min-height: 80px; resize: vertical; font-family: Arial, sans-serif; }
  button { width: 100%; padding: 12px; margin-top: 12px; background: #ff416c; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
  button:hover { opacity: 0.9; }
  .success-msg { color: green; font-weight: bold; margin-top: 15px; text-align: center; }
  .logout-btn { background: #333; margin-top: 15px; }
  .section-title { margin-top: 14px; margin-bottom: 4px; font-size: 13px; font-weight: bold; color: #555; }
  .small-note { font-size: 12px; color: #777; line-height: 1.4; margin: 6px 0 10px; }
</style>
</head>
<body>

<div class="panel">
  <h2>Add Customer</h2>
  <input id="customId" placeholder="Custom ID (ex: vasukil123)">
  <input id="name" placeholder="Owner / Person Name">
  <input id="businessName" placeholder="Business Name (ex: PowerFit Gym, Brother Cafe)">
  <input id="ownerName" placeholder="Owner Name for Save Contact (optional)">
  <input id="saveContactName" placeholder="Save Contact Suggested Name (optional)">
  <select id="category">
    <option value="default">Default / Old Theme</option>
    <option value="gym">Gym / Fitness</option>
    <option value="cafe">Cafe</option>
    <option value="restaurant">Restaurant</option>
    <option value="salon">Salon / Barber</option>
    <option value="doctor">Doctor / Clinic</option>
    <option value="advocate">Advocate / Lawyer</option>
    <option value="realestate">Real Estate</option>
    <option value="coaching">Coaching / Institute</option>
    <option value="retail">Retail Shop</option>
    <option value="creator">Creator / Influencer</option>
  </select>
  <input id="countryCode" placeholder="Country Code (ex: +91 India, +65 Singapore)" value="+91">
  <input id="phone" placeholder="Phone / Mobile Number">
  <input id="whatsapp" placeholder="WhatsApp Number (optional)">
  <input id="profileImage" placeholder="Profile Image URL (optional)">

  <div class="section-title">Main Buttons</div>
  <div class="small-note">Front card par sirf important buttons show honge: Call, WhatsApp, Website, Social Media, Location, Save Contact. Website direct open hogi. Card click/swipe par flip hoga.</div>
  <input id="instagram" placeholder="Social Media / Instagram URL">
  <input id="website" placeholder="Website URL">
  <input id="location" placeholder="Google Maps Location URL">
  <input id="whatsappGroup" placeholder="WhatsApp Group Link (optional)">
  <textarea id="services" placeholder="Our Services (optional) - comma ya line wise services likho"></textarea>

  <div class="section-title">Old Theme Fallback</div>
  <select id="theme">
    <option value="light">Light</option>
    <option value="dark">Dark</option>
    <option value="luxury">Luxury</option>
  </select>
  
  <button onclick="addCustomer()">Add Customer</button>
  <button class="logout-btn" onclick="logoutAdmin()">Logout</button>
  <div class="success-msg" id="successMsg"></div>
</div>

<script type="module">
import { db, ref, set, get, storage, sRef, uploadBytes, getDownloadURL, auth, onAuthStateChanged, signOut } from "./firebase.js";

// ✅ PROTECT ROUTE: Agar user login nahi hai to wapas login page par bhejo
onAuthStateChanged(auth, (user) => {
  if (!user) {
    window.location.href = "admin-login.html";
  }
});

// ✅ LOGOUT FUNCTION
window.logoutAdmin = function() {
    signOut(auth).then(() => {
        window.location.href = "admin-login.html";
    });
};

function getCountryCode(){
  let code = String(document.getElementById("countryCode")?.value || "+91").trim();
  let digits = code.replace(/\D/g, "");
  return digits || "91";
}

function normalizePhoneForSave(number, countryCode){
  const raw = String(number || "").trim();
  if(!raw) return "";

  // Full international number diya hai, jaise +65 9123 4567 ya 0091 94147 25264
  if(raw.startsWith("+")){
    const digits = raw.replace(/\D/g, "");
    return digits ? "+" + digits : "";
  }
  if(raw.startsWith("00")){
    const digits = raw.replace(/\D/g, "").replace(/^00/, "");
    return digits ? "+" + digits : "";
  }

  // Local number diya hai to selected country code add hoga.
  let digits = raw.replace(/\D/g, "");
  digits = digits.replace(/^0+/, ""); // local trunk zero remove
  const code = String(countryCode || getCountryCode()).replace(/\D/g, "") || "91";

  // Agar user ne already country code ke sath digits likh diye, double add nahi hoga.
  if(!digits.startsWith(code)){
    digits = code + digits;
  }
  return digits ? "+" + digits : "";
}

window.addCustomer = async function(){
  const btn = document.querySelector("button");
  const id = document.getElementById("customId").value.trim().toLowerCase().replace(/[^a-z0-9_-]/g, "");
  const name = document.getElementById("name").value.trim();
  const businessName = document.getElementById("businessName").value.trim();
  const ownerName = document.getElementById("ownerName").value.trim();
  const saveContactName = document.getElementById("saveContactName").value.trim();
  const category = document.getElementById("category").value || "default";
  const countryCode = getCountryCode();
  const rawPhone = document.getElementById("phone").value.trim();
  const rawWhatsapp = document.getElementById("whatsapp").value.trim();
  const phone = normalizePhoneForSave(rawPhone, countryCode);
  const whatsapp = normalizePhoneForSave(rawWhatsapp || rawPhone, countryCode);
  const profileImage = document.getElementById("profileImage").value.trim();
  const instagram = document.getElementById("instagram").value.trim();
  const website = document.getElementById("website").value.trim();
  const location = document.getElementById("location").value.trim();
  const whatsappGroup = document.getElementById("whatsappGroup").value.trim();
  const services = document.getElementById("services").value.trim();
  const theme = document.getElementById("theme").value;

  if(!id || !name || !phone){
    alert("ID, Name, Country Code, and Phone required hain. Example: Country Code +91 / +65, Phone local number ya full +country number.");
    return;
  }

  btn.disabled = true;
  btn.innerText = "Adding...";

  try {
      // check duplicate
      const snapshot = await get(ref(db, 'customers/' + id));
      if(snapshot.exists()){
        alert("This ID already exists! Choose a different ID.");
        btn.disabled = false;
        btn.innerText = "Add Customer";
        return;
      }

 
     await set(ref(db, 'customers/' + id), {
  name,
  businessName,
  ownerName,
  saveContactName,
  category,
  themeType: category,
  businessCategory: category,
  countryCode: "+" + countryCode,
  phone,
  whatsapp,
  profileImage,
  instagram,
  website,
  location,
  whatsappGroup,
  services,
  theme,
  scans: 0
});

      const basePath = window.location.pathname.replace(/admin-panel\.html$/i, "index.html");
      const cardLink = window.location.origin + basePath + "?id=" + encodeURIComponent(id);
      document.getElementById("successMsg").innerHTML = "Customer Added Successfully ✅<br>Card Link: <a href='" + cardLink + "' target='_blank'>" + cardLink + "</a><br><small>Is link ko QR/NFC me use karo.</small>";
      
      // Form Clear karna taaki dusra user add karne me aasaani ho
      document.querySelectorAll("input").forEach(input => input.value = "");
      document.getElementById("countryCode").value = "+91";
      document.getElementById("category").value = "default";
      document.getElementById("theme").value = "light";
      
      setTimeout(() => {
          document.getElementById("successMsg").innerText = "";
      }, 4000);

  } catch(e) {
      alert("Error adding customer: " + e.message);
  } finally {
      btn.disabled = false;
      btn.innerText = "Add Customer";
  }
};
</script>
</body>
</html>
