<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="styles.css"><title>Login | Vasuki NFC</title></head><body><header class="topbar"><div class="shell nav"><div class="brand">VASUKI <span>NFC</span></div><a class="btn light" href="index.html">Open Card</a></div></header><main class="shell page"><section class="panel login-box"><span class="pill">Secure account</span><h1 style="margin-top:14px">Welcome back</h1><p class="muted">Use the email and password provided with your smart card.</p><div id="msg" class="notice bad hidden"></div><form id="loginForm"><div class="field"><label>Email / Login ID</label><input id="email" type="email" required autocomplete="username"></div><div class="field" style="margin-top:14px"><label>Password</label><input id="password" type="password" required autocomplete="current-password"></div><button class="gold" style="width:100%;margin-top:18px">Login</button></form><p class="muted" style="margin-top:15px">Forgot password? Contact Vasuki NFC support: 6377393721</p></section></main><script type="module">import{auth,signInWithEmailAndPassword,roleOf,$}from'./shared.js';document.querySelector('#loginForm').onsubmit=async e=>{e.preventDefault();const b=e.submitter,m=$('#msg');b.disabled=true;try{const c=await signInWithEmailAndPassword(auth,$('#email').value.trim(),$('#password').value);const r=await roleOf(c.user.uid);location.href=['owner','admin','support'].includes(r)?'owner.html':'customer.html'}catch(err){m.textContent='Login failed. Check email/password or contact support.';m.classList.remove('hidden')}finally{b.disabled=false}};</script></body></html>
